# BFME Beacon – Server-Konfiguration für den Docker-Container (Beispiel)
#
# Auf dem Host:   <Beacon-Ordner>/config.toml (z. B. /opt/beacon/config.toml)
# Im Container:   /config.toml (read-only eingebunden, siehe compose.yaml)
#
# Passwort setzen: siehe docs/anleitung/server.md, „Passwort setzen“. Dabei werden
# `salt` und `psk` unten eingetragen – das Passwort selbst wird nie gespeichert.
# Diese Datei trotzdem privat halten: der Schlüssel öffnet den Server wie das
# Passwort. Nach Änderungen: docker compose restart

# Name des Servers (sehen die Spieler beim Verbinden).
server_name = "BFME Beacon"

# Begrüßungstext in der Lobby.
motd = "Willkommen in Mittelerde! Viel Spaß."

# EIN Port für TCP (Steuerkanal, Lobby, Karten) UND UDP (Spiel-Relay).
# Im Router beide Protokolle auf diesen Port weiterleiten.
port = 28086

# Im Container auf allen Schnittstellen lauschen; was nach außen geht,
# regeln die Port-Freigaben in compose.yaml. "[::]" = IPv6 und IPv4.
bind = "0.0.0.0"

# Höchstzahl gleichzeitiger Spieler (1–253).
max_players = 16

# Diese Spielernamen sind immer Host, solange sie verbunden sind
# (Groß-/Kleinschreibung egal), z. B. ["Aragorn"]. Sonst ist der erste
# Spieler Host; verlässt er die Lobby, geht die Rolle an den nächsten.
admin_names = []

# Werden von `beacon-server set-password` gesetzt – nicht von Hand ändern.
salt = ""
psk = ""

# Kartenordner im Container (read-only): /maps/<Kartenname>/<Dateien>.
# Auf dem Host: <Beacon-Ordner>/maps
maps_dir = "/maps"

# Kartenordner alle N Sekunden neu einlesen (0 = nur beim Start und bei SIGHUP:
# docker compose kill -s HUP beacon).
map_rescan_secs = 60

# Beschreibbarer Ordner für dauerhafte Daten (feste virtuelle IP pro Spielername).
# Auf dem Host: <Beacon-Ordner>/data (muss dem Container-Benutzer gehören,
# siehe `user:` in compose.yaml).
data_dir = "/data"

# Status-Endpunkt (GET /health, GET /status als JSON). Im Container auf allen
# Schnittstellen, damit Docker ihn weiterreichen kann; compose.yaml gibt ihn
# nur auf 127.0.0.1 des Hosts frei. Der Healthcheck nutzt ihn ebenfalls.
status_bind = "0.0.0.0:28087"

# Protokoll-Ausführlichkeit: error, warn, info, debug, trace.
log_level = "info"

# Kosten der Passwort-Ableitung (Argon2id). Nach Änderungen das Passwort neu setzen.
[kdf]
m = 19456
t = 2
p = 1

# Wie oft jedes Spielpaket gesendet wird (identische Kopien nach 3 ms und 10 ms),
# damit ein verlorenes Paket das Spiel nicht einfriert. Werte 1–3.
[redundancy]
lobby = 3  # BFME-Lobby-Ports 8086–8093 (viele Lobby-Nachrichten kommen nur einmal)
game = 2   # Ports im laufenden Spiel 8094–8101
other = 1

# Grenzwerte gegen Missbrauch und Überlast.
[limits]
relay_pps = 800              # Relay-Pakete pro Sekunde und Spieler
relay_burst = 1600
preauth_pps = 100            # ungültige UDP-Pakete pro Sekunde und Quell-IP
preauth_burst = 200
control_msgs_per_s = 50      # Steuernachrichten pro Sekunde und Verbindung
control_burst = 100
map_chunks_per_s = 400       # Karten-Download: Anfragen (je 32 KiB) pro Sekunde
chat_per_minute = 20
chat_burst = 5
chat_max_len = 300           # Zeichen pro Chatzeile
handshake_failures = 5       # Fehlversuche (z. B. falsches Passwort) pro IP bis zur Sperre
handshake_ban_secs = 60      # erste Sperre; jede weitere doppelt so lang (max. 15 min)
max_pending_handshakes = 64
max_connections_per_ip = 16  # Spieler hinter einem Router teilen sich eine IP
kick_ban_secs = 60           # gekickte Spieler können so lange nicht wieder beitreten

# Benachrichtigungen, z. B. per ntfy aufs Handy (optional): HTTP-POST mit dem
# Text als Inhalt und dem Header "Title". Nur http:// (kein TLS) – also die
# eigene ntfy-Instanz im Heimnetz/Docker-Netz, siehe docs/anleitung/server.md.
# Ereignisse: start, stop, join, leave, launch, kick.
#[webhook]
#url = "http://host.docker.internal:8080/bfme"
#token = ""                  # wird als "Authorization: Bearer <token>" gesendet
#events = ["join", "launch"]
#title = ""                  # Standard: server_name
#[webhook.headers]
#Tags = "crossed_swords"
#Priority = "default"
