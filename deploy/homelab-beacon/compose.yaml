# BFME Beacon – Lobby- und Relay-Server für „Die Schlacht um Mittelerde“ (BFME1 1.03)
#
# Pfad auf dem Server: /srv/docker/beacon
# Starten:             cd /srv/docker/beacon && docker compose up -d --build
# Logs:                docker compose logs -f beacon
# Karten neu einlesen: docker compose kill -s HUP beacon
#
# Inhalt von /srv/docker/beacon (Einrichtung siehe README.md):
#   compose.yaml, config.toml, Dockerfile, .dockerignore,
#   beacon-server (statisches Linux-Binary), maps/, data/ (Besitzer 1000:1001)
#
# Ports: 28086 TCP UND UDP für die Spieler (im Router freigeben oder Tailscale),
#        28087 nur auf 127.0.0.1 des Hosts (Status-JSON und Healthcheck).

services:
  beacon:
    build:
      context: .
      dockerfile: Dockerfile
    image: beacon-server:local
    container_name: beacon
    restart: unless-stopped
    user: "1000:1001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "0.0.0.0:28086:28086/tcp"
      - "0.0.0.0:28086:28086/udp"
      - "127.0.0.1:28087:28087"
    volumes:
      - ./config.toml:/config.toml:ro
      - ./maps:/maps:ro
      - ./data:/data
    # Nur nötig, wenn der Webhook (config.toml, [webhook]) eine ntfy-Instanz
    # erreichen soll, die auf dem Host selbst läuft:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/beacon-server", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
