[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["BFME Beacon contributors"]
repository = "https://github.com/Floderso/bfme-beacon"
homepage = "https://github.com/Floderso/bfme-beacon"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.release-hook]
inherits = "release"
panic = "abort"
lto = true
