# Builds and publishes a release when a tag v<version> is pushed:
#   Beacon-<version>-windows.zip          Beacon.exe, wsock32.dll, LIESMICH.txt, LICENSE.txt
#   beacon-server-<version>-linux-x86_64  static musl binary
#   SHA256SUMS
#   ghcr.io/floderso/bfme-beacon-server:<version> (+ :latest unless a prerelease)
# The tag must match [workspace.package] version in Cargo.toml, and CHANGELOG.md
# needs a "## [<version>]" section (its text becomes the release notes).
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  IMAGE: ghcr.io/floderso/bfme-beacon-server

jobs:
  meta:
    name: Version check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from the tag, checked against Cargo.toml and CHANGELOG.md
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          workspace=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$version" != "$workspace" ]; then
            echo "::error::tag $TAG does not match the workspace version $workspace"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [$version]'"
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  windows:
    name: Windows package
    needs: [meta, ci]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable, x86_64-pc-windows-gnullvm host, i686 target)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install stable-x86_64-pc-windows-gnullvm --profile minimal --target i686-pc-windows-gnullvm --force-non-host --no-self-update
          rustup default stable-x86_64-pc-windows-gnullvm
          rustc -Vv

      - name: Install llvm-mingw (pinned release, SHA-256 verified)
        run: ./.github/scripts/setup-llvm-mingw.ps1

      - name: Build Beacon.exe (release, x86_64-pc-windows-gnullvm)
        run: cargo build --locked --release -p beacon-launcher --target x86_64-pc-windows-gnullvm

      - name: Build wsock32.dll (cargo hook)
        run: cargo hook --locked

      - name: Check the binaries (exports, version marker, imports)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $exe = 'target/x86_64-pc-windows-gnullvm/release/Beacon.exe'
          $dll = 'target/i686-pc-windows-gnullvm/release-hook/wsock32.dll'
          python -m pip install --disable-pip-version-check pefile==2024.8.26
          python crates/beacon-hook/tools/check_exports.py $dll
          # The launcher only replaces a wsock32.dll that carries this marker.
          python -c "import sys; d = open(sys.argv[1], 'rb').read(); m = b'BFME-BEACON-HOOK/' + sys.argv[2].encode() + b'\0'; sys.exit(0 if m in d else f'marker {m!r} not found')" $dll $env:VERSION
          # Players have no llvm-mingw runtime DLLs: everything must be linked statically.
          foreach ($f in @($exe, $dll)) {
            $imports = & "$env:LLVM_MINGW_BIN/llvm-objdump.exe" -p $f | Select-String -CaseSensitive 'DLL Name:'
            $imports | ForEach-Object { Write-Host "$f -> $($_.Line.Trim())" }
            if ($imports -match 'libunwind|libc\+\+|libwinpthread') { throw "$f imports an llvm-mingw runtime DLL" }
          }

      # --- Authenticode signing (planned) ---------------------------------------
      # Unsigned binaries trigger SmartScreen and can be blocked by Smart App
      # Control. SignPath Foundation signs open-source projects for free
      # (https://signpath.org). Once the project is accepted:
      #  1. upload the unsigned files first:
      # - name: Upload unsigned binaries
      #   id: unsigned
      #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      #   with:
      #     name: unsigned
      #     path: |
      #       target/x86_64-pc-windows-gnullvm/release/Beacon.exe
      #       target/i686-pc-windows-gnullvm/release-hook/wsock32.dll
      #     if-no-files-found: error
      #  2. submit them for signing and wait (pin the action to a commit SHA):
      # - name: Sign with SignPath
      #   uses: signpath/github-action-submit-signing-request@<commit-sha> # v1.x
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: <SignPath organization id>
      #     project-slug: bfme-beacon
      #     signing-policy-slug: release-signing
      #     artifact-configuration-slug: windows
      #     github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: signed
      #  3. package Beacon.exe and wsock32.dll from signed/ in the next step.
      # ---------------------------------------------------------------------------

      - name: Package Beacon-${{ env.VERSION }}-windows.zip
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          $dir = Join-Path $stage 'Beacon'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target/x86_64-pc-windows-gnullvm/release/Beacon.exe $dir
          Copy-Item target/i686-pc-windows-gnullvm/release-hook/wsock32.dll $dir
          # Text files with CRLF line endings for Windows editors.
          $utf8Bom = New-Object System.Text.UTF8Encoding $true
          $text = (Get-Content -Raw -Encoding utf8 packaging/windows/LIESMICH.txt) -replace "`r?`n", "`r`n"
          [IO.File]::WriteAllText((Join-Path $dir 'LIESMICH.txt'), $text, $utf8Bom)
          $text = (Get-Content -Raw -Encoding utf8 LICENSE) -replace "`r?`n", "`r`n"
          [IO.File]::WriteAllText((Join-Path $dir 'LICENSE.txt'), $text)
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = Join-Path (Resolve-Path dist) "Beacon-$env:VERSION-windows.zip"
          Push-Location $stage
          7z a -tzip -mx=9 $zip Beacon
          Pop-Location
          7z l $zip

      - name: Upload the Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/Beacon-${{ env.VERSION }}-windows.zip
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux server binary
    needs: [meta, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable, musl target)
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl --no-self-update
          rustup default stable
          rustc -Vv

      - name: Build beacon-server (static, x86_64-unknown-linux-musl)
        run: cargo build --locked --release -p beacon-server --target x86_64-unknown-linux-musl

      - name: Check and stage the binary
        run: |
          bin=target/x86_64-unknown-linux-musl/release/beacon-server
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie linked'
          test "$("$bin" version)" = "beacon-server $VERSION"
          mkdir -p dist
          cp "$bin" "dist/beacon-server-$VERSION-linux-x86_64"
          chmod 0755 "dist/beacon-server-$VERSION-linux-x86_64"

      - name: Upload the Linux binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: dist/beacon-server-${{ env.VERSION }}-linux-x86_64
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker image
    needs: [meta, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux
          path: dist

      - name: Build the image
        run: |
          ctx=$(mktemp -d)
          install -m 0755 "dist/beacon-server-$VERSION-linux-x86_64" "$ctx/beacon-server"
          docker build \
            --file deploy/Dockerfile \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$VERSION" \
            "$ctx"
          test "$(docker run --rm "$IMAGE:$VERSION" version)" = "beacon-server $VERSION"

      - name: Push to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          if [ "$PRERELEASE" != "true" ]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          docker logout ghcr.io

  release:
    name: GitHub release
    needs: [meta, windows, linux, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows
          path: dist

      - name: Download the Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux
          path: dist

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ---

          **Spieler:** \`Beacon-$VERSION-windows.zip\` herunterladen, entpacken, \`Beacon.exe\` starten ([Anleitung](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/anleitung/spielen.md)).

          **Server:** \`docker pull $IMAGE:$VERSION\` ([Anleitung](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/anleitung/server.md)) oder \`beacon-server-$VERSION-linux-x86_64\`.

          Prüfsummen: \`SHA256SUMS\`. Die Programme sind noch nicht digital signiert.
          EOF
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "BFME Beacon $VERSION" \
            --notes-file notes.md \
            "${flags[@]}"
